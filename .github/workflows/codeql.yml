name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '37 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: C/C++ CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq
          --no-install-recommends cmake ninja-build clang
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build for analysis
        run: >-
          cmake -Wdev --warn-uninitialized -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_STANDARD=99
          -DCMAKE_C_STANDARD_REQUIRED=ON
          -DCMAKE_C_EXTENSIONS=OFF
      - name: Build
        run: cmake --build build
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          category: /language:c-cpp
