repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i --style=file
        language: system
        files: '\.(c|h)$'
      - id: cppcheck
        name: cppcheck
        entry: >-
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem
          --std=c99 -Iinclude
        language: system
        files: '\.(c|h)$'
