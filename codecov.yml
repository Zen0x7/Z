coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        paths:
          - include/
    patch:
      default:
        target: 100%
        paths:
          - include/

ignore:
  - "tests/**"
  - "fuzz/**"
  - "cmake/**"
  - "compiler/**"
  - "tools/**"

comment:
  layout: reach, diff, flags, files
  behavior: default
  require_changes: false
